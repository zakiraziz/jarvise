# Jarvis AI Assistant - Complete Configuration

# OpenAI Configuration
openai:
  api_key: "${OPENAI_API_KEY}"  # Use environment variable
  organization: "${OPENAI_ORG_ID}"  # Optional
  model: "gpt-4-turbo-preview"  # Options: gpt-3.5-turbo, gpt-4, gpt-4-turbo-preview
  temperature: 0.7  # 0.0-1.0, higher = more creative
  max_tokens: 2000
  top_p: 0.95
  frequency_penalty: 0.0
  presence_penalty: 0.0
  timeout: 30  # seconds
  max_retries: 3
  streaming: true  # Enable response streaming

# Assistant Identity
assistant:
  name: "Jarvis"
  full_name: "Just A Rather Very Intelligent System"
  version: "2.0.0"
  creator: "Tony Stark Technologies"
  personality: "professional, helpful, witty"
  catchphrases:
    - "At your service, sir."
    - "I've taken the liberty of..."
    - "Shall I inform Miss Potts?"
  
  # Conversation Settings
  max_conversation_history: 50
  context_window: 10
  auto_save_conversations: true
  conversations_dir: "conversations"
  
  # Response Settings
  response_style: "concise"  # concise, detailed, technical, casual
  include_sources: true
  markdown_formatting: true
  emoji_enabled: true
  
  # Learning
  learning_enabled: true
  user_preferences_file: "data/preferences.json"
  memory_enabled: true
  memory_file: "data/memory.json"

# Speech Settings
speech:
  enabled: true
  engine: "pyttsx3"  # pyttsx3, gtts, azure, amazon
  voice_id: ""  # System-specific voice ID
  voice_rate: 150  # Words per minute
  voice_volume: 1.0  # 0.0-1.0
  voice_gender: "male"  # male, female, neutral
  language: "en-US"
  
  # Google TTS (if using gtts)
  gtts:
    slow: false
    lang: "en"
  
  # Azure TTS (if using azure)
  azure:
    key: "${AZURE_TTS_KEY}"
    region: "eastus"
    voice_name: "en-US-GuyNeural"
  
  # Speech Recognition
  recognition:
    enabled: true
    engine: "google"  # google, sphinx, azure, whisper
    language: "en-US"
    timeout: 5
    phrase_time_limit: 10
    energy_threshold: 300
    pause_threshold: 0.8
    dynamic_energy_threshold: true

# Features Configuration
features:
  # Communication Modes
  voice_mode: true
  text_mode: true
  gui_mode: false
  api_mode: false
  
  # Core Features
  web_search: true
  file_operations: true
  system_commands: true
  code_execution: false  # Sandboxed
  email_integration: false
  calendar_integration: false
  home_automation: false
  
  # Web Features
  web_search:
    enabled: true
    engine: "duckduckgo"  # google, bing, duckduckgo
    api_key: "${SEARCH_API_KEY}"
    max_results: 5
    safe_search: true
  
  # File Operations
  file_operations:
    allowed_extensions:
      - .txt
      - .pdf
      - .docx
      - .xlsx
      - .jpg
      - .png
      - .py
      - .js
      - .html
      - .css
      - .json
      - .yaml
    max_file_size_mb: 50
    working_directory: "./workspace"
    allow_delete: false
    allow_modify: true
  
  # System Commands
  system_commands:
    allowed_commands:
      - "date"
      - "time"
      - "uptime"
      - "whoami"
      - "pwd"
      - "ls"
      - "dir"
      - "echo"
    blocked_commands:
      - "rm"
      - "del"
      - "format"
      - "shutdown"
      - "reboot"
      - "sudo"
      - "chmod"
      - "chown"
    command_timeout: 10
    require_confirmation: true
  
  # Code Execution
  code_execution:
    enabled: false
    languages:
      - python
      - javascript
      - bash
    sandbox: true
    docker_image: "python:3.9-slim"
    timeout: 5
    memory_limit: "256m"
    cpu_limit: "0.5"
    # Integrations
  integrations:
    email:
      enabled: false
      service: "gmail"
      email: "${EMAIL}"
      password: "${EMAIL_PASSWORD}"
    
    calendar:
      enabled: false
      service: "google"
      credentials_file: "credentials/calendar.json"
    
    spotify:
      enabled: false
      client_id: "${SPOTIFY_CLIENT_ID}"
      client_secret: "${SPOTIFY_CLIENT_SECRET}"
    
    github:
      enabled: false
      token: "${GITHUB_TOKEN}"
      username: "${GITHUB_USERNAME}"
    
    weather:
      enabled: true
      api_key: "${WEATHER_API_KEY}"
      default_city: "New York"
      units: "metric"  # metric, imperial
    
    news:
      enabled: true
      api_key: "${NEWS_API_KEY}"
      sources: ["bbc-news", "cnn", "reuters"]
      categories: ["technology", "science"]
    
    stocks:
      enabled: false
      api_key: "${STOCKS_API_KEY}"
      default_symbols: ["AAPL", "GOOGL", "MSFT"]

# Safety Settings
safety:
  enabled: true
  level: 2  # 1-4, higher = more strict
  
  # Content Filtering
  blocked_keywords:
    - "format c:"
    - "rm -rf"
    - "del /f"
    - "dd if="
    - "mkfs"
    - ":(){ :|:& };:"  # Fork bomb
    - "chmod 777"
    - "chown -R"
    - "sudo rm"
    - "> /dev/sda"
  
  blocked_patterns:
    - pattern: "eval\\(.*input"
      reason: "Code injection risk"
    - pattern: "exec\\(.*\\$\\_GET"
      reason: "Command injection risk"
    - pattern: "base64_decode\\(.*\\)"
      reason: "Obfuscated code"
  
  # URL Filtering
  allowed_domains:
    - "*.wikipedia.org"
    - "*.github.com"
    - "*.stackoverflow.com"
    - "*.python.org"
    - "*.npmjs.com"
  
  blocked_domains:
    - "*.malware.com"
    - "*.phishing.com"
  
  # Data Protection
  sensitive_patterns:
    - pattern: "\\b\\d{16}\\b"  # Credit card
      action: "redact"
    - pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"  # Email
      action: "warn"
    - pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"  # SSN
      action: "redact"
  
  # Rate Limiting
  rate_limit:
    enabled: true
    max_requests_per_minute: 60
    max_tokens_per_minute: 90000
    max_conversations_per_hour: 30

# Logging Configuration
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    detailed:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    
    simple:
      format: "%(asctime)s - %(levelname)s - %(message)s"
      datefmt: "%H:%M:%S"
    
    json:
      format: '{"time": "%(asctime)s", "level": "%(levelname)s", "name": "%(name)s", "message": "%(message)s"}'
      datefmt: "%Y-%m-%d %H:%M:%S"
  
  handlers:
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "simple"
      stream: "ext://sys.stdout"
    
    file:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "detailed"
      filename: "logs/jarvis.log"
      maxBytes: 10485760  # 10MB
      backupCount: 5
    
    error_file:
      class: "logging.handlers.RotatingFileHandler"
      level: "ERROR"
      formatter: "detailed"
      filename: "logs/error.log"
      maxBytes: 10485760
      backupCount: 5
    
    json_file:
      class: "logging.handlers.RotatingFileHandler"
      level: "INFO"
      formatter: "json"
      filename: "logs/jarvis.json"
      maxBytes: 10485760
      backupCount: 3
  
  loggers:
    jarvis:
      level: "DEBUG"
      handlers: ["console", "file", "json_file"]
      propagate: false
    
    jarvis.security:
      level: "INFO"
      handlers: ["console", "file"]
      propagate: false
    
    jarvis.speech:
      level: "INFO"
      handlers: ["console", "file"]
      propagate: false
    
    jarvis.integrations:
      level: "INFO"
      handlers: ["file"]
      propagate: false
  
  root:
    level: "WARNING"
    handlers: ["console"]

# Database Configuration
database:
  enabled: false
  type: "sqlite"  # sqlite, postgresql, mongodb
  connection_string: "sqlite:///jarvis.db"
  
  sqlite:
    database: "jarvis.db"
    timeout: 5
    isolation_level: null
  
  postgresql:
    host: "localhost"
    port: 5432
    database: "jarvis"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    pool_size: 10
    max_overflow: 20
  
  mongodb:
    host: "localhost"
    port: 27017
    database: "jarvis"
    username: "${MONGO_USERNAME}"
    password: "${MONGO_PASSWORD}"
    auth_source: "admin"

# Cache Configuration
cache:
  enabled: true
  type: "memory"  # memory, redis, file
  ttl: 3600  # seconds
  max_size: "100MB"
  
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD}"
    decode_responses: true
  
  file:
    directory: "cache"
    compression: true

# UI Configuration
ui:
  theme: "dark"  # dark, light, system
  colors:
    primary: "#00ff00"  # Jarvis green
    secondary: "#ffffff"
    error: "#ff0000"
    warning: "#ffff00"
    success: "#00ff00"
    info: "#0000ff"
  
  console:
    show_banner: true
    show_timestamp: true
    show_token_usage: true
    typing_animation: true
    progress_bar: true
  
  web:
    enabled: false
    host: "127.0.0.1"
    port: 5000
    debug: false
    secret_key: "${WEB_SECRET_KEY}"
  
  gui:
    enabled: false
    width: 1024
    height: 768
    fullscreen: false
    always_on_top: false

# API Configuration
api:
  enabled: false
  host: "127.0.0.1"
  port: 8000
  workers: 4
  timeout: 60
  
  authentication:
    enabled: true
    type: "jwt"  # jwt, oauth2, api_key
    secret_key: "${API_SECRET_KEY}"
    token_expiry: 3600
    
  endpoints:
    - "/api/v1/chat"
    - "/api/v1/process"
    - "/api/v1/files"
    - "/api/v1/system"
    
  rate_limit:
    enabled: true
    requests_per_minute: 100

# Environment-specific overrides
environments:
  development:
    logging:
      level: "DEBUG"
    safety:
      level: 1
    features:
      code_execution:
        enabled: true
  
  production:
    logging:
      level: "WARNING"
    safety:
      level: 3
    features:
      code_execution:
        enabled: false
    database:
      enabled: true
